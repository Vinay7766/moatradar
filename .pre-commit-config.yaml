repos:
  - repo: local
    hooks:
      - id: backend-ruff
        name: Backend Ruff Check
        entry: bash -c "cd backend && uv run ruff check app tests eval"
        language: system
        pass_filenames: false
      - id: frontend-lint
        name: Frontend ESLint
        entry: bash -c "cd frontend && npm run lint"
        language: system
        pass_filenames: false
