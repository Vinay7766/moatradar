name: Bug Report
description: Report an unexpected error or incorrect behavior in MoatRadar.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug in MoatRadar! Please provide reproduction details below.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear summary of the bug and observed error output.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provider, model, input parameters, and step where the failure occurs.
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: LLM Provider
      options:
        - ollama
        - gemini
        - openai
        - anthropic
        - groq
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model Identifier
      placeholder: e.g. gemma4:12b, gpt-4o-mini
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or stack trace
      render: shell
